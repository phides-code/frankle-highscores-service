AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  AwsCfToken:
    Type: String
    NoEcho: true
    Description: Token for API auth (e.g. Cloudflare or custom); set via --parameter-overrides AwsCfToken=xxx when deploying

Resources:
  FrankleHighscoresService:
    Type: AWS::Serverless::Api
    Description: "Serverless API for CRUD operations"
    Properties:
      Name: "frankle-highscores-service"
      StageName: Prod
      Cors:
        AllowMethods: "'OPTIONS, POST, GET'"
        AllowHeaders: "'Content-Type, X-CF-Token'"
        AllowOrigin: "'https://frankle.phil-code.com'" # replace with frontend app URL

      # Logging settings
      MethodSettings:
        - LoggingLevel: INFO
          ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          DataTraceEnabled: true        

  FrankleHighscoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 10
      Handler: dist/index.lambdaHandler
      Runtime: nodejs24.x
      Environment:
        Variables:
          AWS_CF_TOKEN: !Ref AwsCfToken  # comes from --parameter-overrides      
      Policies:
        - AWSLambdaExecute
        - DynamoDBCrudPolicy:
            TableName: !Ref FrankleHighscoresTable
      Events:
        HighscoresOptions:
          Type: Api
          Properties:
            Path: /highscores
            Method: OPTIONS
            RestApiId: !Ref FrankleHighscoresService
        GetHighscores:
          Type: Api
          Properties:
            Path: /highscores
            Method: GET
            RestApiId: !Ref FrankleHighscoresService
        PutHighscore:
          Type: Api
          Properties:
            Path: /highscores
            Method: POST
            RestApiId: !Ref FrankleHighscoresService
    Metadata:
      BuildMethod: makefile

  FrankleHighscoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FrankleHighscores
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
